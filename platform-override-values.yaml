global:
  host: jad.localhost

edc:
  controlplane:
    trustedIssuers:
      - name: cxtck
        id: "did:web:cx-tck.edc-v.svc.cluster.local:issuer"
  issuerservice:
    # Catena-X credentials are VCDM 1.1 JWTs (the dataspace profile requests VC1_0_JWT): the issuer must use
    # the matching DCP profile, as it gives every credential definition the format of its profile
    dcpProfile: vc11-sl2021/jwt
  identityhub:
    scopes:
      - name: membership
        pattern: 'org\.eclipse\.tractusx\.vc\.type:(.+):(read|\*|all)'
        leftOperand: "verifiableCredential.credential.type"
        operator: "contains"
        rightOperand: "$1"
  siglet:
    refreshEndpointPolicy:
      allowHttp: true
    tokenApiAuth:
      enabled: true
      adminScope:
        enabled: true
    transferTypes:
      - transferType: "HttpData-PULL"
        endpointType: "https://w3id.org/idsa/v4.1/HTTP"
        endpoint: "http://provider:8080/data"
        tokenSource: "provider"
        txRenewalSupport: true
