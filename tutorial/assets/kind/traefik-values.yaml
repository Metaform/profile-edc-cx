# Traefik values for the Aurora tutorial (adapted from eclipse-dataspace-hub/jad values.yaml).
#
# Traefik is the Gateway API controller CPD's `edcv-gateway` binds to. The GatewayClass and
# Gateway themselves are created by the CPD chart, so they are disabled here.
accessLog:
  enabled: true
  format: json
ports:
  web:
    port: 80
    hostPort: 80
  websecure:
    port: 443
    exposedPort: 443
    hostPort: 443
providers:
  kubernetesGateway:
    enabled: true
  kubernetesCRD:
    enabled: true
gatewayClass:
  enabled: false
gateway:
  enabled: false
