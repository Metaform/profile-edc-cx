# KinD cluster for the Aurora tutorial (adapted from eclipse-dataspace-hub/jad kind-config.yaml).
#
# Maps host ports 80/443 into the node container. Together with the hostPort settings in
# traefik-values.yaml this makes the gateway reachable on http://cpd.localhost without any
# kubectl port-forward. Port mappings are fixed at cluster creation.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
